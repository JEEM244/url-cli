<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabVault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-mark">TV</div>
      <div class="brand-copy">
        <h1>TabVault</h1>
        <p>Guardar y recuperar pestañas</p>
      </div>
      <span id="status" class="status" role="status">Listo</span>
    </header>

    <section class="summary" aria-label="Estado del navegador">
      <div><strong id="tab-count">—</strong><span>Pestañas</span></div>
      <div><strong id="window-count">—</strong><span>Ventanas</span></div>
      <div><strong id="group-count">—</strong><span>Grupos</span></div>
    </section>

    <section class="capture-section">
      <div class="section-heading">
        <h2>Sesión actual</h2>
        <span>EDGE</span>
      </div>
      <label class="private-option">
        <input id="include-private" type="checkbox">
        Incluir pestañas InPrivate
      </label>
      <p id="private-hint" class="hint">El estado de InPrivate aparecerá aquí.</p>
      <button id="capture" class="button button-primary">Guardar respaldo JSON</button>
      <button id="create-board" class="button">Crear lista HTML</button>
    </section>

    <section class="restore-section">
      <div class="section-heading">
        <h2>Usar un respaldo</h2>
        <span>JSON</span>
      </div>
      <label class="file-picker">
        <span>Elegir archivo JSON…</span>
        <input id="backup-file" type="file" accept=".json,application/json">
      </label>
      <div id="restore-preview" class="restore-preview">No has seleccionado ningún archivo.</div>
      <div class="restore-actions">
        <button id="create-from-backup" class="button" disabled>Crear lista</button>
        <button id="restore" class="button" disabled>Restaurar pestañas</button>
      </div>
    </section>

    <footer>Los respaldos se guardan en tu equipo.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
