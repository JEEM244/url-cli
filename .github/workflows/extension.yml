name: Edge extension checks

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check extension/popup.js
      - name: Validate extension manifest and board template
        shell: pwsh
        run: |
          $manifest = Get-Content extension/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw "Manifest V3 is required." }
          if (-not $manifest.permissions.Contains("tabs")) { throw "The tabs permission is required." }
          foreach ($path in @("extension/popup.html", "extension/popup.css", "extension/popup.js", "extension/board-template.html")) {
            if (-not (Test-Path $path)) { throw "Missing extension file: $path" }
          }
          $template = Get-Content extension/board-template.html -Raw
          if ($template -notmatch "__BOARD_DATA__") { throw "Board data placeholder is missing." }
          $html = Get-Content extension/popup.html -Raw
          if ($html -notmatch 'id="create-board"' -or $html -notmatch 'id="create-from-backup"') { throw "Board export controls are missing." }
          Write-Host "Extension files and HTML board template validated."
