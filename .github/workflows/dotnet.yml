name: TabVault build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/TabVault.Cli/TabVault.Cli.csproj --configuration Release

      - name: Run regression tests
        run: dotnet run --no-build --configuration Release --project src/TabVault.Cli -- test
